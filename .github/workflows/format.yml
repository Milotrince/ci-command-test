name: Precommit Checks (Lint and Format)

on:
  # Marking a pull request ready for review starts the Nyx Plugin workflow, which follows this one.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 45 && echo "lint attempt ${{ github.run_attempt }}"
