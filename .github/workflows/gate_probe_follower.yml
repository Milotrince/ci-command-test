name: Gate Probe Follower
on:
  workflow_run:
    workflows: ["Gate Probe"]
    types: [completed]
jobs:
  follow:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "conclusion=${{ github.event.workflow_run.conclusion }} attempt=${{ github.event.workflow_run.run_attempt }} sha=${{ github.event.workflow_run.head_sha }} event=${{ github.event.workflow_run.event }}"
