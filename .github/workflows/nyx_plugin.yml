name: Nyx Plugin

# Checking out the internal plugin repository needs a token, and a pull request coming from a fork is never given
# one. 'workflow_run' runs in the context of the base repository, where secrets are available, hence the only trigger
# able to validate such a pull request. In exchange, this file is always taken from the default branch, and the
# outcome has to be published as a check on the commit under test to show up on it at all.
on:
  workflow_run:
    workflows: ["Precommit Checks (Lint and Format)"]
    types: [completed]

# Pull requests come from forks, whose branch names collide across contributors, so the repository they live in is
# part of what tells two runs apart.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}
    ${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  # The plugin only supports dynamic arrays, and its own CI covers the other backends and precisions.
  GS_ENABLE_NDARRAY: "1"
  GS_BACKEND: "gpu"
  GS_PRECISION: "32"

jobs:
  setup:
    name: nyx_plugin-setup

    # Only a pull request is worth checking, the plugin being validated before a change lands rather than after.
    if: github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-24.04

    permissions:
      pull-requests: read

    outputs:
      IS_SKIPPED: ${{ steps.check.outputs.is_skipped }}

    steps:
      # The pull request is asked of the API as in the setup job of the production workflow, the event never listing
      # its draft flag. The API gives the flag when this job runs, where the other gated workflows read it from their
      # event. A ready one among the pull requests sharing the commit asks for it to be tested.
      - name: Check the pull request
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pulls = data.filter((pull) => pull.head.sha === run.head_sha);
            core.setOutput('is_skipped', pulls.every((pull) => pull.draft));

  unit-tests:
    name: nyx_plugin-unit_tests

    needs: setup

    # The renderer bridges to Genesis through CUDA device pointers, so a GPU runner is required even though the
    # simulation itself could run on CPU. This is the runner the plugin's own CI uses, which additionally makes its
    # reference images comparable.
    runs-on: ubuntu-24.04

    # A draft pull request is gated as in the production workflow. Re-running the precommit run, which '/ci' does (see
    # the CI Command workflow), starts a new run of this workflow that passes the gate.
    if: needs.setup.outputs.IS_SKIPPED == 'false' || github.event.workflow_run.run_attempt > 1 || github.run_attempt > 1

    permissions:
      contents: read
      # To be able to resolve the log of this very job.
      actions: read
      checks: write

    steps:
      - run: echo "nyx tests ran, attempt ${{ github.run_attempt }}, upstream attempt ${{ github.event.workflow_run.run_attempt }}"
