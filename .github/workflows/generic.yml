name: Generic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  generic-cpu:
    name: generic-cpu
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && (!github.event.pull_request.draft || github.run_attempt > 1)
    steps:
      - run: sleep 150 && echo ran
